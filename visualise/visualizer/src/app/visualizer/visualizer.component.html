<div *ngIf="currentStep">
  <h3>Step {{ currentStepIndex + 1 }} / {{ steps.length }} - {{ currentStep.action }}</h3>

  <div class="array-display">
    <ng-container *ngFor="let val of currentStep.arr; let i = index">
      <div class="array-item-container">
        <div *ngIf="i === currentStep.windowStart" class="pointer start-pointer">
          windowStart
        </div>

        <span
          [ngClass]="{
            'in-window': i >= currentStep.windowStart && i <= currentStep.windowEnd,
            'avg-mode': currentStep.mode === 'average',
            'max-mode': currentStep.mode === 'max',
            'min-mode': currentStep.mode === 'min',
            'distinct-mode': currentStep.mode === 'distinct',
            'fruits-mode': currentStep.mode === 'fruits',
            'norepeat-mode': currentStep.mode === 'norepeat',
            'replacement-mode': currentStep.mode === 'replacement',
            'max-ones-mode': currentStep.mode === 'max-ones',
            'permutation-mode': currentStep.mode === 'permutation'
          }"
        >
          {{ val }}
        </span>

        <div *ngIf="i === currentStep.windowEnd" class="pointer end-pointer">
          windowEnd
        </div>
      </div>
    </ng-container>
  </div>

  <div class="variables">
    <ng-container *ngFor="let key of getKeys(currentStep)">
      <ng-container *ngIf="key !== 'arr' && key !== 'mode' && key !== 'action'">
        <div>
          <strong>{{ key }}:</strong>
          <span [ngClass]="{'variable-changed': hasVariableChanged(key)}">{{ formatVariable(currentStep[key]) }}</span>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <div class="controls">
    <button (click)="prev()">⏮ Prev</button>
    <button (click)="play()">▶️ Play</button>
    <button (click)="pause()">⏸ Pause</button>
    <button (click)="next()">⏭ Next</button>
    <button (click)="stop()">⏹ Stop</button>
  </div>
</div>
