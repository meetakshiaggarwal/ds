<div *ngIf="currentStep">
  <h3>Step {{ currentStepIndex + 1 }} / {{ steps.length }}</h3>

  <div class="array-display">
    <span
      *ngFor="let val of currentStep.arr; let i = index"
      [ngClass]="{
        pointer: i === currentStep.windowStart || i === currentStep.windowEnd,
        'avg-mode': currentStep.mode === 'average',
        'max-mode': currentStep.mode === 'max',
        'min-mode': currentStep.mode === 'min',
        'distinct-mode': currentStep.mode === 'distinct',
        'norepeat-mode': currentStep.mode === 'norepeat'
      }"
    >
      {{ val }}
    </span>
  </div>

  <div class="variables">
    <div *ngFor="let key of getKeys(currentStep)">
      <ng-container *ngIf="key !== 'arr' && key !== 'mode'">
        <strong>{{ key }}:</strong> {{ currentStep[key] }}
      </ng-container>
    </div>
  </div>

  <div class="controls">
    <button (click)="prev()">⏮</button>
    <button (click)="play()">▶️</button>
    <button (click)="pause()">⏸</button>
    <button (click)="next()">⏭</button>
    <button (click)="stop()">⏹</button>
  </div>
</div>
