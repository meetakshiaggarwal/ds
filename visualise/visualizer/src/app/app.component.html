<div class="container">
  <h1>Sliding Window Visualizer</h1>

  <label>
    Select a Problem:
    <select [(ngModel)]="selectedProblem">
      <option *ngFor="let p of problems" [value]="p.id">{{ p.label }}</option>
    </select> 
  </label>

  <label>
    Array: 
    <input [(ngModel)]="inputArray" placeholder="[1,2,3]" />
  </label>

  <label>
    K / Target: 
    <input type="number" [(ngModel)]="k" />
  </label>

  <button (click)="run()">Run</button>

  <app-visualizer [steps]="steps" [speed]="1000"></app-visualizer>

</div>
